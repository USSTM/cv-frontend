name: cv-frontend-prod

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_API_URL: https://api.inventory.usstm.ca
        restart: unless-stopped
        mem_limit: 512m
        expose:
            - "3000"
        environment:
            PORT: 3000
        networks:
            edge:
                aliases:
                    - cv-frontend-app

networks:
    edge:
        name: usstm-edge
        external: true
